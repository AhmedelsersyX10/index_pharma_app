<script>
  (function () {
    const list = document.getElementById('branchList');
    if (!list) return;

    const labels = list.querySelectorAll('label');

    labels.forEach((label) => {
      label.addEventListener('click', () => {
        labels.forEach((l) => {
          l.classList.remove('bg-brand-mint-surface', 'shadow-sm');
          l.classList.add('bg-surface-container-low');
          const indicator = l.querySelector('.shrink-0.rounded-full');
          if (indicator) {
            indicator.className = 'w-6 h-6 rounded-full bg-surface-container-highest flex items-center justify-center shrink-0 mt-0.5 group-hover:bg-outline-variant/60 transition-colors';
            indicator.innerHTML = '<div class="w-2 h-2 rounded-full bg-surface-container-lowest"></div>';
          }
          const title = l.querySelector('span.font-title-md');
          if (title) {
            title.classList.remove('text-brand-emerald-dark');
            title.classList.add('text-on-surface');
          }
        });

        label.classList.remove('bg-surface-container-low');
        label.classList.add('bg-brand-mint-surface', 'shadow-sm');
        const indicator = label.querySelector('.shrink-0.rounded-full');
        if (indicator) {
          indicator.className = 'w-6 h-6 rounded-full bg-primary flex items-center justify-center shrink-0 mt-0.5 shadow-sm';
          indicator.innerHTML = '<span class="material-symbols-outlined text-on-primary text-[16px] font-bold">check</span>';
        }
        const title = label.querySelector('span.font-title-md');
        if (title) {
          title.classList.remove('text-on-surface');
          title.classList.add('text-brand-emerald-dark');
        }
      });
    });

    const confirmBtn = document.getElementById('confirmBranchBtn');
    if (confirmBtn) {
      confirmBtn.addEventListener('click', () => {
        const originalContent = confirmBtn.innerHTML;
        confirmBtn.disabled = true;
        confirmBtn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[20px]">progress_activity</span><span>جاري تهيئة بيانات الفرع...</span>';
        setTimeout(() => {
          confirmBtn.innerHTML = '<span class="material-symbols-outlined text-[20px]">done</span><span>تم تبديل الفرع بنجاح</span>';
          confirmBtn.classList.replace('bg-primary', 'bg-brand-emerald-dark');
          setTimeout(() => {
            history.back();
          }, 600);
        }, 800);
      });
    }
  })();
